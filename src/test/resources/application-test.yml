spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false

task-queue:
  max-concurrent-tasks: 2
  scheduler:
    enabled: false

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    org.pakicek: DEBUG