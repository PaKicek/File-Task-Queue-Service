services:
  postgres:
    image: postgres:16-alpine
    container_name: task-queue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_queue_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task-queue-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_queue_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-queue-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task_queue_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JAVA_OPTS: -Xms512m -Xmx1024m -XX:+EnableDynamicAgentLoading
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - task-queue-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  task-queue-network:
    driver: bridge